
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Alberto Clocks</title>

<link rel="icon" type="image/x-icon" href="logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

 body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f5f3ee;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

  body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('product/bg.png') no-repeat center center;
            background-size: cover;
            filter: blur(2px);
            /* Fixed: added 'px' unit */
            z-index: -1;
            /* Pushes the background behind all your content */
        }

.login-card {
    width: 100%;
    max-width: 480px;
    min-height: auto;
    display: block;
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 15px 45px rgba(31, 25, 15, .12);
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

 

.watch-content {
    position: relative;
    z-index: 1;
}

.brand {
    color: #e0bf79;
    font-family: Georgia, serif;
    font-size: 19px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 22px;
}

 

.gold-line {
    height: 2px;
    width: 65px;
    background: #d7b46e;
    margin-bottom: 25px;
}

 

 .form-panel {
    padding: 50px 45px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.logo-text {
    font-family: Georgia, serif;
    font-size: 27px;
    color: #1c1b18;
    margin-bottom: 15px;
}

.logo-text span {
    color: #b18a43;
}


.form-panel h2 {
    font-family: Georgia, serif;
    font-size: 42px;
    color: #191919;
    margin-bottom: 8px;
}

.description {
    color: #858585;
    font-size: 14px;
    line-height: 1.8;
    margin-bottom: 22px;
}

.form-label {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 9px;
}

.input-box {
    position: relative;
    margin-bottom: 23px;
}

.input-box > i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #61605e;
}

.form-control {
    min-height: 53px;
    border: 1px solid #e4e0d7;
    border-radius: 10px;
    padding: 13px 45px;
    background: #fcfbf9;
    color: #222;
    font-size: 14px;
}

.form-control::placeholder {
    color: #aaa;
}

.form-control:focus {
    border-color: #b18a43;
    box-shadow: 0 0 0 4px rgba(177,138,67,.10);
    background: white;
}

.password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: #888;
    cursor: pointer;
}

.login-btn {
    width: 100%;
    min-height: 54px;
    border: none;
    border-radius: 10px;
    background: #191919;
    color: white;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .5px;
    transition: .3s ease;
    margin-top: 5px;
}

.login-btn:hover {
    background: #b18a43;
    color: white;
    box-shadow: 0 8px 22px rgba(177,138,67,.22);
    transform: translateY(-2px);
}

.login-btn i {
    margin-left: 9px;
    transition: .3s;
}

.login-btn:hover i {
    transform: translateX(4px);
}

.back-link {
    display: block;
    text-align: center;
    text-decoration: none;
    color: #9b783a;
    font-size: 13px;
    margin-top: 25px;
}

.back-link:hover {
    color: #191919;
}

.secure-note {
    border-top: 1px solid #eeeae2;
    padding-top: 20px;
    margin-top: 35px;
    text-align: center;
    color: #999;
    font-size: 11px;
    letter-spacing: .5px;
}

.secure-note i {
    color: #887f7f;
    margin-right: 6px;
}

/* RESPONSIVE */

@media (max-width: 760px) {
    body {
        padding: 15px;
    }

    .login-card {
        max-width: 480px;
        grid-template-columns: 1fr;
    }

    

    .form-panel {
        padding: 35px 28px;
    }

    .logo-text {
        margin-bottom: 30px;
    }

    .form-panel h2 {
        font-size: 35px;
    }
}
</style>
</head>

<body>

<div class="login-card">
 

    <section class="form-panel">

        <div class="logo-text">
            Alberto <span>Clocks.</span>
        </div>

        <h2>Welcome Back.</h2>

        <p class="description">
            Sign in to continue your checkout and make your next
            timeless purchase.
        </p>

        <form id="loginForm">

            <label for="email" class="form-label">Email Address</label>
            <div class="input-box">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" class="form-control"
                       placeholder="Enter your email" required
                       autocomplete="email">
            </div>

            <label for="password" class="form-label">Password</label>
            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" class="form-control"
                       placeholder="Enter your password" required
                       autocomplete="current-password">

                <button type="button" class="password-toggle"
                        id="togglePassword" aria-label="Show password">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="login-btn">
                Login & Continue
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <a href="collections.html" class="back-link">
            <i class="fa-solid fa-arrow-left me-1"></i>
            Back to Collections
        </a>

        <div class="secure-note">
            <i class="fa-solid fa-shield-halved"></i>
            YOUR LUXURY EXPERIENCE AWAITS
        </div>

    </section>
</div>

<script>
const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");

toggle.addEventListener("click", function () {
    const show = password.type === "password";

    password.type = show ? "text" : "password";
    toggle.innerHTML = show
        ? '<i class="fa-regular fa-eye-slash"></i>'
        : '<i class="fa-regular fa-eye"></i>';
});

document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    // Demo only: credentials are not verified.
    sessionStorage.setItem("albertoLoggedIn", "true");
    window.location.href = "collections.html";
});
</script>

</body>
</html>
